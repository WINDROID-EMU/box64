### Auto build Box64 and release its binary with Github Action
name: Build and Release Box64

permissions:
  actions: 'write'
  contents: 'write'

on:
  workflow_dispatch:
  release:
  push:
    paths:
      - "**/*.c"
      - "**/*.h"
      - "**/*.S"
      - "**/*.py"
      - "CMakeLists.txt"
      - "**/*.yml"
      - "**/*.def"
  pull_request:
    types: [assigned, opened, synchronize, reopened]
    paths:
      - "**/*.c"
      - "**/*.h"
      - "**/*.S"
      - "**/*.py"
      - "CMakeLists.txt"
      - "**/*.yml"
      - "**/*.def"

defaults:
  run:
    # needed on container images which could default to sh
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ANDROID]
        type: [Release]
        include:
          - platform: ANDROID
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image || '' }}
    steps:
      - name: "Checkout Box64 Repository"
        uses: actions/checkout@v4

      - name: Get all the unique changed directory names
        id: changed-files-dir-names
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          dir_names: "true"

      - name: Early exit other jobs if this is a ARM64-only change
        id: early-exit-arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.changed-files-dir-names.outputs.all_modified_files == 'src/dynarec/arm64'
        continue-on-error: true
        run: |
          if [[ ${{ matrix.platform }} != 'RISCV' && ${{ matrix.platform }} != 'LARCH64' && ${{ matrix.platform }} != 'PPC64LE' && ${{ matrix.platform }} != 'X64' ]]; then
            exit 1
          fi

      - name: Early exit other jobs if this is a LA64-only change
        id: early-exit-la64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.changed-files-dir-names.outputs.all_modified_files == 'src/dynarec/la64'
        continue-on-error: true
        run: |
          if [[ ${{ matrix.platform }} == 'LARCH64' ]]; then
            exit 1
          fi

      - name: Early exit other jobs if this is a RV64-only change
        id: early-exit-rv64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.changed-files-dir-names.outputs.all_modified_files == 'src/dynarec/rv64'
        continue-on-error: true
        run: |
          if [[ ${{ matrix.platform }} == 'RISCV' ]]; then
            exit 1
          fi

      - name: Early exit other jobs if this is a PPC64LE-only change
        id: early-exit-ppc64le
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: steps.changed-files-dir-names.outputs.all_modified_files == 'src/dynarec/ppc64le'
        continue-on-error: true
        run: |
          if [[ ${{ matrix.platform }} == 'PPC64LE' ]]; then
            exit 1
          fi

      - name: Do not early exit otherwise
        id: early-exit-never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRS: ${{ steps.changed-files-dir-names.outputs.all_modified_files }}
        if: env.DIRS != 'src/dynarec/arm64' && env.DIRS != 'src/dynarec/la64' && env.DIRS != 'src/dynarec/rv64' && env.DIRS != 'src/dynarec/ppc64le'
        continue-on-error: true
        run: exit 1

      - name: Merge early exit conditions
        id: early-exit
        if: steps.early-exit-arm64.outcome == 'failure' || steps.early-exit-la64.outcome == 'failure' || steps.early-exit-rv64.outcome == 'failure' || steps.early-exit-ppc64le.outcome == 'failure' || steps.early-exit-never.outcome == 'failure'
        continue-on-error: true
        run: exit 1

      # Use `steps.early-exit.outcome == 'failure'` to check whether the current step should be processed.

      - name: "Environment preparation"
        if: steps.early-exit.outcome == 'failure'
        run: |
          sudo apt-get update
          zydis_package=libzydis-dev
          if [[ ${{ matrix.platform }} != 'X64' && ${{ matrix.platform }} != 'RISCV' && ${{ matrix.platform }} != 'LARCH64' && ${{ matrix.platform }} != 'PPC64LE' ]]; then
            sudo apt-get -y install git cmake make python3 patchelf $zydis_package
            if [[ ${{ matrix.platform }} == 'ANDROID' || ${{ matrix.platform }} == 'TERMUX' ]]; then
              sudo apt-get -y install p7zip
              wget -q https://google.com
              unzip -qq android-ndk-r26b-linux.zip
              echo "BOX64_COMPILER=$PWD/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang" >> $GITHUB_ENV
              
              # --- OTIMIZAÇÃO DE HARDWARE MOBILE (WINDROID-EMU) ---
              # -DLD80BITS=0: Remove overhead de float x87 de 80 bits inexistente no ARM
              # -DNOALIGN=1: Evita quebras de penalidade por acessos desalinhados de memória RAM
              echo "BOX64_PLATFORM_MARCRO=-DANDROID=1 -DARM_DYNAREC=1 -DBAD_SIGNAL=1 -DLD80BITS=0 -DNOALIGN=1" >> $GITHUB_ENV
              
              # --- FLAGS EXTRAS DO CLANG (COMPILAÇÃO NATIVA DO ECOSSISTEMA) ---
              # -O3: Vetorização agressiva e desdobramento de laços (Loops)
              # -flto=thin: Elimina redundâncias de códigos cruzados diminuindo o binário final
              # -march/mtune: Habilita instruções nativas de criptografia/CRC nativas do ARMv8
              echo "BOX64_CFLAGS=-O3 -flto=thin -march=armv8-a+crc+crypto -mtune=generic" >> $GITHUB_ENV
              
              git clone https://github.com
              cd termux-docker
              git checkout 148b93d989cbc572719e050135b3e13f115f2a8e~1
              cd ..
              sudo cp -rf termux-docker/system/arm /system
              sudo chown -R $(whoami):$(whoami) /system
              sudo chmod 755 -R /system
            elif [[ ${{ matrix.platform }} == 'ANDROID_GLIBC' ]]; then
              sudo apt-get -y install git gcc-aarch64-linux-gnu
              echo "BOX64_PLATFORM_MARCRO=-DARM64=1 -DWINLATOR_GLIBC=1 -DARM_DYNAREC=1 -DBAD_SIGNAL=1" >> $GITHUB_ENV
              echo "BOX64_COMPILER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
              echo "BOX64_CFLAGS=" >> $GITHUB_ENV
            elif [[ ${{ matrix.platform }} == 'WOW64' ]]; then
              sudo apt-get -y install git gcc-aarch64-linux-gnu
              echo "BOX64_PLATFORM_MARCRO=-DWOW64=1 -DARM_DYNAREC=1" >> $GITHUB_ENV
              echo "BOX64_COMPILER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
              echo "BOX64_CFLAGS=" >> $GITHUB_ENV
              export LLVM_MINGW_VERSION=20260311
              wget -q https://github.com{LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-aarch64.tar.xz
              tar -xf llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-aarch64.tar.xz
              echo "MINGW_COMPILER_PATH=$PWD/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-aarch64/bin" >> $GITHUB_ENV
            else
              sudo apt-get -y install git gcc-aarch64-linux-gnu
              echo "BOX64_PLATFORM_MARCRO=-D${{ matrix.platform }}=1" >> $GITHUB_ENV
              echo "BOX64_COMPILER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
              echo "BOX64_CFLAGS=" >> $GITHUB_ENV
            fi
            if [[ ${{ matrix.platform }} == 'TERMUX' ]]; then
              wget https://termux.dev
              7z x libandroid-sysv-semaphore_0.1-1_aarch64.deb
              tar -xf data.tar.xz
              sudo cp -rf data /
              sudo chmod 755 -R /data
              sudo chown -R $(whoami):$(whoami) /data
              echo "CFLAGS=-L/data/data/com.termux/files/usr/lib" >> $GITHUB_ENV
              echo "IS_TERMUX=1" >> $GITHUB_ENV
              echo "QEMU_SET_ENV=LD_LIBRARY_PATH=/data/data/com.termux/files/usr/lib" >> $GITHUB_ENV
            else
              echo "IS_TERMUX=0" >> $GITHUB_ENV
            fi
          else
            echo "BOX64_CFLAGS=" >> $GITHUB_ENV
            if [[ ${{ matrix.platform }} == 'X64' ]]; then
              echo "BOX64_PLATFORM_MARCRO=-DLD80BITS=1 -DNOALIGN=1" >> $GITHUB_ENV
              echo "BOX64_COMPILER=gcc" >> $GITHUB_ENV
              sudo apt-get -y install git cmake make python3 libzydis-dev
            elif [[ ${{ matrix.platform }} == 'RISCV' ]]; then
              echo BOX64_PLATFORM_MARCRO="-DRV64=ON" >> $GITHUB_ENV
              echo "BOX64_COMPILER=riscv64-linux-gnu-gcc-14" >> $GITHUB_ENV
              sudo apt-get -y install git gcc-14-riscv64-linux-gnu cmake make python3 ninja-build libglib2.0-dev libzydis-dev
            elif [[ ${{ matrix.platform }} == 'LARCH64' ]]; then
              sudo mkdir /usr/local/larch
              wget -O- -q https://github.com | sudo tar -C /usr/local/larch --strip-components=1 --xz -xf -
              sudo ln -sf /usr/local/larch/target /usr/loongarch64-linux-gnu
              sudo cp -r /usr/local/larch/loongarch64-unknown-linux-gnu/lib/* /usr/loongarch64-linux-gnu/lib64/
              for i in objdump objcopy strip; do
                sudo ln -sf /usr/local/larch/bin/loongarch64-unknown-linux-gnu-$i /usr/bin/loongarch64-linux-gnu-$i
              done
              echo '/usr/local/larch/bin/loongarch64-unknown-linux-gnu-gcc -L/usr/local/larch/loongarch64-unknown-linux-gnu "$@"' | sudo tee /usr/bin/loongarch64-linux-gnu-gcc
              echo '/usr/local/larch/bin/loongarch64-unknown-linux-gnu-g++ -L/usr/local/larch/loongarch64-unknown-linux-gnu "$@"' | sudo tee /usr/bin/loongarch64-linux-gnu-g++
              sudo chmod 755 /usr/bin/loongarch64-linux-gnu-{gcc,g++}

              echo BOX64_PLATFORM_MARCRO="-DLARCH64=ON" >> $GITHUB_ENV
              
